```ini
[pytest]

testpaths =
    tests

python_files =
    test_*.py
    *_test.py

python_classes =
    Test*

python_functions =
    test_*


# ---------------------------------------------------------------------------
# Default pytest options
# ---------------------------------------------------------------------------

# Do not run hardware tests by default.
#
# Hardware tests require a physical device connected to the Raspberry Pi.
# Run them explicitly with:
#
#     pytest -m hardware
#
addopts =
    -ra
    -m "not hardware"

markers =
    unit: Unit tests that do not require external hardware
    integration: Integration tests using mocked or simulated external interfaces
    hardware: End-to-end tests that require physical hardware

# Fail if an unknown marker is used.
strict_markers = true

# Fail if pytest.ini contains an invalid configuration option.
strict_config = true

# Show test durations.
console_output_style = progress
```
